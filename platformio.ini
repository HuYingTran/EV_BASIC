; Đồ án: Hệ thống phát hiện và tránh vật cản cho xe điện 4WD cỡ nhỏ
; Bo mạch: Arduino Uno+WiFi R3 (ATmega328P + ESP8266 trên cùng một bo)
;
;   pio run -e uno -t upload        (DIP 3,4 = ON, còn lại OFF)
;   pio run -e esp8266 -t upload    (DIP 5,6,7 = ON, còn lại OFF)
;   Chạy thật:                      DIP 1,2 = ON (ATmega <-> ESP8266), còn lại OFF
;
; Code dùng chung (giao thức UART) nằm trong include/protocol.h

[platformio]
default_envs = uno, esp8266

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<*> +<uno/>
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X@^1.3.1

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
build_src_filter = -<*> +<esp/>
; Bố cục 1 MB chạy được cho mọi bản flash của module ESP8266 trên bo
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.1m64.ld
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
